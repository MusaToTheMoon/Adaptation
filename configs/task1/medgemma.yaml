experiment_name: task1_gpt5 

model:
  type: medgemma           #model handler type as written in models/__init__.py
  name: google/medgemma-27b-text-it  # just as it appears in huggingface

cache_dir: /scratch/mk8737/huggingface #modify to your own cache directory

dataset:
  path: datasets/qa/arastem.json   #path to dataset JSON file
  instruction_path: prompts/task1.txt  #path to instruction file (default.txt)

task:
  type: mcq                #task 1: mcq or task 2: answer_generation

output:
  predictions_path: results/predictions/task1/medgemma_arastem.csv #specify output pred file
  metrics_path: results/metrics/task1/medgemma_arastem.json  #specift output pred file
