experiment_name: task1_autocap_medgemma

model:
  type: autocap_medgemma
  name: google/medgemma-27b-text-it
  cache_dir: /scratch/mk8737/huggingface
  offline: true
  candidate_languages: ["Arabic", "English", "French"]
  top_k_languages: 3
  selection_max_tokens: 128
  weight_max_tokens: 128
  reasoning_max_tokens: 512
  do_sample: false

dataset:
  path: datasets/qa/medarabench.json
  instruction_path: prompts/task1.txt

task:
  type: mcq
  lang: ar

output:
  predictions_path: results/predictions/task1/medarabench/autocap_medgemma.csv
  metrics_path: results/metrics/task1/medarabench/autocap_medgemma.json
  debug_path: results/debug/task1/medarabench/autocap_medgemma.jsonl
