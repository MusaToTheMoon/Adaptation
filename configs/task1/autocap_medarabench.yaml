experiment_name: task1_autocap_mistral_small

model:
  type: autocap
  name: mistralai/Mistral-Small-3.2-24B-Instruct-2506
  cache_dir: /scratch/mk8737/huggingface
  offline: true
  candidate_languages: ["Arabic", "English", "French"]
  top_k_languages: 3
  selection_max_tokens: 128
  weight_max_tokens: 128
  reasoning_max_tokens: 512   
  do_sample: false

dataset:
  path: datasets/qa/medarabench.json
  instruction_path: prompts/task1.txt

task:
  type: mcq
  lang: ar

output:
  predictions_path: results/predictions/task1/medarabench/autocap_mistral_small.csv
  metrics_path: results/metrics/task1/medarabench/autocap_mistral_small.json
  debug_path: results/debug/task1/medarabench/autocap_mistral_small.jsonl