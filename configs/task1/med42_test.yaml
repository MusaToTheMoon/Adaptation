constants:
  model:
    type: med42
    name: m42-health/Llama3-Med42-70B
    offline: false
  dataset: test
  task:
    name: task1
    type: mcq

experiment_name: ${constants.task.name}_${constants.model.type}_${constants.dataset}

model:
  type: ${constants.model.type}            #model handler type as written in models/__init__.py
  name: ${constants.model.name}  # just as it appears in huggingface
  cache_dir: /scratch/mk8737/huggingface #modify to your own cache directory
  offline: ${constants.model.offline}     #set to true if you want to load model from local cache, false to download from HuggingFace
  device_map: auto
  max_memory_per_gpu_gib:

dataset:
  path: datasets/qa/${constants.dataset}.json   #path to dataset JSON file
  instruction_path: prompts/${constants.task.name}.txt  #path to instruction file (default.txt)

task:
  type: ${constants.task.type}                #task 1: mcq or task 2: answer_generation

output:
  predictions_path: results/predictions/${constants.task.name}/${constants.dataset}/${constants.model.type}.csv #specify output pred file
  metrics_path: results/metrics/${constants.task.name}/${constants.dataset}/${constants.model.type}.json  #specift output pred file